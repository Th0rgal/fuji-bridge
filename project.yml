name: FujiBridge
options:
  bundleIdPrefix: md.thomas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

schemes:
  FujiBridge:
    build:
      targets:
        FujiBridge: all
    test:
      targets: [FujiBridgeTests]
    run:
      config: Debug
    archive:
      config: Release

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: md.thomas.fujibridge
    # iPhone, iPad, and the Mac through Catalyst ("Optimize for Mac"). One target, one set of sources.
    TARGETED_DEVICE_FAMILY: "1,2,6"
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: BQ6Z84B8L5
    SWIFT_VERSION: "5.9"
    ENABLE_TESTABILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  FujiBridge:
    type: application
    platform: iOS
    sources:
      - path: FujiBridge
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        INFOPLIST_FILE: FujiBridge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FujiBridge/FujiBridge.entitlements
        # The Mac build is sandboxed and needs outgoing TCP. Debug may also listen, for the loopback camera in the tests.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": FujiBridge/FujiBridge-mac.entitlements
        SWIFT_VERSION: "5.9"
      configs:
        Debug:
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": FujiBridge/FujiBridge-mac-debug.entitlements

  FujiBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FujiBridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: md.thomas.fujibridge.tests
        SWIFT_VERSION: "5.9"
